# Render (бесплатный тариф) усыпляет сервер после 15 минут без запросов, первый запрос потом ждёт до минуты.
# Пингуем /health каждые 10 минут. GitHub может запускать расписание с задержкой и отключает его
# после 60 дней без коммитов в репозитории — тогда включите workflow снова во вкладке Actions.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        run: curl -fsS --max-time 120 --retry 2 https://agro-okno-server.onrender.com/health
